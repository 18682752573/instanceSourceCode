apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'com.snailws.taskscompleted'

    defaultConfig {
        applicationId "com.snailws.taskscompleted"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
}
